<div class="order-form-container">
  <h2>Nouvelle commande</h2>

  <form [formGroup]="orderForm" (ngSubmit)="onSubmit()">
    <div formArrayName="orderItems">
      <h3>Articles</h3>

      <div class="order-item-row">
        <div class="form-group">
          <label>Nom de l'article</label>
          <input type="text" formControlName="articleName" placeholder="Ex: Chemise" />
        </div>

        <div class="form-group">
          <label>Prix (€)</label>
          <input type="number" formControlName="price" min="0" step="0.01" />
        </div>

        <button type="button" class="btn-remove" (click)="removeOrderItem()">Retirer</button>
      </div>

      <button type="button" class="btn-add" (click)="addOrderItem()">+ Ajouter un article</button>
    </div>

    <div class="form-group">
      <label>Commentaire (facultatif)</label>
      <textarea formControlName="commentaire" rows="3"></textarea>
    </div>

    <button type="submit">'Envoyer la commande'</button>
  </form>
</div>
