<div class="order-history-container">
  <h2>Mes commandes</h2>

  <div *ngIf="isLoading()">Chargement...</div>
  <div class="alert alert-error" *ngIf="errorMessage()">{{ errorMessage() }}</div>

  <table *ngIf="!isLoading() && orders().length > 0">
    <thead>
      <tr>
        <th>Date</th>
        <th>Statut</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let order of orders()">
        <td>{{ order.createdAt | date: 'dd/MM/yyyy HH:mm' }}</td>
        <td>
          <span
            class="badge"
            [ngClass]="{
              'badge-waiting': order.status === OrderStatus.Waiting,
              'badge-validated': order.status === OrderStatus.Validated,
              'badge-refused': order.status === OrderStatus.Refused,
            }"
          >
            {{ statusLabel(order.status) }}
          </span>
        </td>
        <td>
          <button class="btn-details" (click)="openSummary(order)">Voir détails</button>
        </td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="!isLoading() && orders().length === 0">Vous n'avez pas encore passé de commande.</p>

  <app-order-confirmation-modal
    *ngIf="selectedOrder() as order"
    [order]="order"
    [showActions]="false"
    (close)="closeSummary()"
  ></app-order-confirmation-modal>
</div>
